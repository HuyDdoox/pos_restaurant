    <script>
        (function() {
            var search = window.location.search;
            // Nếu có tham số ?table= thì là thực khách quét QR gọi món tại bàn
            if (search.includes('table=') || search.includes('tableId=')) {
                window.location.replace("views/customer/" + search);
                return;
            }
            // Kiểm tra trạng thái đăng nhập hệ thống
            var userStr = localStorage.getItem('currentUser') || localStorage.getItem('user');
            var token = localStorage.getItem('access_token') || localStorage.getItem('token');
            if (userStr && token) {
                try {
                    var user = JSON.parse(userStr);
                    var role = (user.role || '').toLowerCase();
                    if (role === 'cashier') {
                        window.location.replace("views/staff/cashier.html");
                        return;
                    } else if (role === 'waiter') {
                        window.location.replace("views/staff/waiter.html");
                        return;
                    } else if (role === 'chef') {
                        window.location.replace("views/staff/kitchen.html");
                        return;
                    } else if (role === 'admin') {
                        window.location.replace("views/staff/admin.html");
                        return;
                    }
                } catch (e) {}
            }
            // Chưa đăng nhập -> Bắt buộc chuyển đến màn hình Đăng nhập
            window.location.replace("views/auth/login.html");
        })();
    </script>
